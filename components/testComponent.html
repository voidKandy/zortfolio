<template id="custom-card-template">
  <style>
    :host {
      display: block;
      font-family: Arial, sans-serif;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
      max-width: 300px;
      background: #f9f9f9;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    p {
      margin-top: 8px;
      color: #555;
    }
  </style>
  <h2 id="card-title"></h2>
  <p id="card-content"></p>
</template>

<script>
  class Test extends HTMLElement {
    constructor() {
      super();
      const template = document.getElementById("custom-card-template").content;
      this.attachShadow({mode: "open"}).appendChild(template.cloneNode(true));
    }

    connectedCallback() {
      this.shadowRoot.getElementById("card-title").textContent = this.getAttribute("title");
      this.shadowRoot.getElementById("card-content").textContent = this.getAttribute("content");
    }
  }

  customElements.define("test-component", Test);
</script>
