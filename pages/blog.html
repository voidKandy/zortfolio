<style>
  #blog-page {
    display: flex;
    flex-direction: row;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
  }

  #rendered-blog {
    padding: 1rem;
    background-color: light-dark(var(--offwhite), var(--offblack));
    border-color: light-dark(var(--offblack), var(--offwhite));
    border-left: 1px dotted;
    border-right: 1px dotted;
    border-bottom: 1px dotted;
    font-size: large;
  }

  #rendered-blog header {
    display: flex;
    flex-direction: column;
  }


  #last-modified {
    margin-top: 0.2rem;
    margin-bottom: 0.2rem;
  }

  blog-selector-list {
    margin: 0.5rem;
  }

  md-block {
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: normal;
  }

  md-block hr {
    border: 0.1px solid;
    border-color: light-dark(var(--offblack), var(--offwhite));
    filter: opacity(50%);
  }

  md-block p {
    margin: 0 0.5rem;
    line-height: 1.4;
  }

  md-block p code {
    padding: 1.5px;
    border-radius: 3px;
    background-color: light-dark(var(--light-color), var(--dark-color));
    color: light-dark(var(--dark-color), var(--light-color));
    filter: contrast(50%) sepia(10%);
  }

  md-block pre {
    padding: 1rem;
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre;
  }

  md-block blockquote {
    border-left: 4px solid light-dark(var(--tertiary-blue), var(--secondary-red));
    padding: 0.8rem 0.45rem;
    margin: 1rem;
    backdrop-filter: brightness(102%);
    border-radius: 4px;
  }

  md-block blockquote p {
    margin: 0;

  }

  md-block img {
    max-width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }


  @media (max-width: 930px) {
    #blog-page {
      flex-direction: column;
    }

    blog-selector-list {
      justify-content: center;
    }

    #rendered-blog {
      padding: 0.25rem 0.5rem;
      border-top: 1px dotted;
    }

    md-block pre {
      padding: 0.5rem;
      border-radius: 2px;
    }

  }
</style>
<div id="blog-page">
  <script type="application/json" id="all-blogs-json">
    ||zz .all_blogs json zz||
  </script>
  <blog-selector-list target="#rendered-blog">
  </blog-selector-list>
  <div id="rendered-blog">
    <script>
      function renderLastModified() {
        const last_modified = document.getElementById("last-modified");
        if (last_modified) {
          try {
            const raw = "||zz .last_modified zz||";
            if (raw && /^\d+$/.test(raw)) {
              const nanos = BigInt(raw);
              const millisBigInt = nanos / 1_000_000n;
              const millis = Number(millisBigInt);
              const pstString = new Date(millis).toLocaleString("en-US", {
                timeZone: "America/Los_Angeles",
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "numeric",
                minute: "numeric",
                second: "numeric",
                hour12: true,
                timeZoneName: "short"
              });
              last_modified.textContent = pstString;
            } else {
              last_modified.textContent = "Unknown date";
            }
          } catch (err) {
            console.error("Error converting date:", err);
          }
        }
      }
      renderLastModified();
      document.addEventListener('DOMContentLoaded', () => {
        renderLastModified();
      })
    </script>
    <header>
      <small>
        ||zz .filename zz||
      </small>
      <p id="last-modified"></p>
    </header>
    <md-block src="blog/||zz .filename zz||">
    </md-block>
  </div>
</div>
